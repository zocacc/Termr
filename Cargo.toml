[package]
name = "termr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
crossterm = "0.29"
directories = "6.0"
ratatui = "0.30"
russh = "0.63.3"
serde = { version = "1.0", features = ["derive"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23"
